<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FloraCare 🌿</title>
<!-- Material Symbols for A2UI icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<style>
  :root {
    --bg-main: #f5f5f7;
    --surface: #ffffff;
    --surface-glass: rgba(255, 255, 255, 0.75);
    --border: rgba(0, 0, 0, 0.08);
    --border-hover: rgba(0, 0, 0, 0.15);
    --text-primary: #1d1d1f;
    --text-secondary: #86868b;
    --accent: #1b5e20;
    --accent-light: #e8f5e9;
    --user-bubble: #1d1d1f;
    --agent-bubble: #ffffff;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.08);
    --radius-sm: 10px;
    --radius-md: 18px;
    --radius-lg: 24px;
    --radius-pill: 9999px;
    --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-main: #000000;
      --surface: #1c1c1e;
      --surface-glass: rgba(28, 28, 30, 0.75);
      --border: rgba(255, 255, 255, 0.12);
      --border-hover: rgba(255, 255, 255, 0.22);
      --text-primary: #f5f5f7;
      --text-secondary: #86868b;
      --accent: #4caf50;
      --accent-light: rgba(76, 175, 80, 0.15);
      --user-bubble: #2c2c2e;
      --agent-bubble: #1c1c1e;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: var(--font-apple);
    background-color: var(--bg-main);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* --- Navigation / Top Bar --- */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: var(--surface-glass);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #34c759, #248a3d);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
    font-size: 1.25rem;
  }

  .brand-title {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .brand-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background-color: #34c759;
    box-shadow: 0 0 0 2px rgba(52, 199, 89, 0.2);
  }

  /* --- Chat Area --- */
  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 84px 20px 110px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    scroll-behavior: smooth;
  }

  #log {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Welcome Screen Hero */
  .hero-container {
    text-align: center;
    margin: 32px 0 20px 0;
    padding: 24px 16px;
  }

  .hero-logo {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: linear-gradient(135deg, #34c759, #1b5e20);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 2.2rem;
    margin-bottom: 16px;
    box-shadow: var(--shadow-md);
  }

  .hero-title {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }

  .hero-subtitle {
    font-size: 0.95rem;
    color: var(--text-secondary);
    max-width: 440px;
    margin: 0 auto 24px auto;
    line-height: 1.45;
  }

  .quick-prompts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 580px;
    margin: 0 auto;
  }

  .prompt-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    font-size: 0.85rem;
    color: var(--text-primary);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .prompt-pill:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* Message bubbles */
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 82%;
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg.agent {
    align-self: flex-start;
    align-items: flex-start;
  }

  .bubble {
    padding: 12px 18px;
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
    box-shadow: var(--shadow-sm);
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  .msg.agent .bubble {
    background: var(--agent-bubble);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  /* Rich Card bubble wrapper */
  .bubble.rich {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    width: 100%;
    max-width: 100%;
    white-space: normal;
  }

  /* Pulsing Typing indicator */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 16px;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--text-secondary);
    opacity: 0.6;
    animation: pulse 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* --- A2UI Component Styles (Apple-inspired Cards) --- */
  .a2card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 20px;
    box-shadow: var(--shadow-md);
    width: 100%;
    max-width: 520px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 10px; }
  .a2col { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .a2row { display: flex; flex-direction: row; gap: 10px; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }

  .a2text { margin: 0; line-height: 1.45; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.01em; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.82rem; color: var(--text-secondary); }

  .a2divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 0;
    width: 100%;
  }

  .a2img {
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm);
    display: block;
  }

  .material-symbols-outlined {
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--accent);
  }

  /* --- Bottom Floating Input Bar --- */
  .input-wrapper {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 20px;
    background: linear-gradient(180deg, rgba(245, 245, 247, 0) 0%, var(--bg-main) 40%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    justify-content: center;
    z-index: 100;
  }

  form {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 720px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 6px 8px 6px 20px;
    box-shadow: var(--shadow-lg);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  form:focus-within {
    border-color: rgba(0, 0, 0, 0.25);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    form:focus-within {
      border-color: rgba(255, 255, 255, 0.35);
    }
  }

  input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 0.96rem;
    font-family: var(--font-apple);
    color: var(--text-primary);
    outline: none;
    padding: 8px 4px;
  }

  input::placeholder {
    color: var(--text-secondary);
  }

  button#send-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--user-bubble);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.2s ease;
    flex-shrink: 0;
  }

  button#send-btn:hover {
    transform: scale(1.05);
  }

  button#send-btn:active {
    transform: scale(0.95);
  }

  button#send-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">🌿</div>
    <div>
      <div class="brand-title">FloraCare</div>
      <div class="brand-status"><span class="status-dot"></span> Asistente botánico</div>
    </div>
  </div>
</header>

<div id="chat-container">
  <div id="log">
    <!-- Welcome Screen Hero -->
    <div class="hero-container" id="hero">
      <div class="hero-logo">🌿</div>
      <h1 class="hero-title">Hola, soy FloraCare</h1>
      <p class="hero-subtitle">Tu especialista en plantas, recomendaciones sin alergias y cuidado natural para tu hogar.</p>
      
      <div class="quick-prompts">
        <button class="prompt-pill" onclick="sendPrompt('¿Qué plantas son seguras si tengo alergia al polen?')">🌸 Plantas sin alergias</button>
        <button class="prompt-pill" onclick="sendPrompt('Recomiéndame una planta de interior fácil y resistente')">🪴 Planta fácil de interior</button>
        <button class="prompt-pill" onclick="sendPrompt('¿Cómo y cada cuánto debo regar una Monstera?')">💧 Cuidados de Monstera</button>
      </div>
    </div>
  </div>
</div>

<div class="input-wrapper">
  <form id="form">
    <input id="input" placeholder="Pregunta sobre plantas, cuidados o alergias…" autocomplete="off" autofocus>
    <button type="submit" id="send-btn" aria-label="Enviar">
      <svg viewBox="0 0 24 24">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
      </svg>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const hero = document.getElementById("hero");
const form = document.getElementById("form");
const input = document.getElementById("input");
const chatContainer = document.getElementById("chat-container");

// Persistent user ID across conversations
let userId = localStorage.getItem("floracare_user_id");
if (!userId) {
  userId = "user-" + Math.random().toString(36).substring(2, 10);
  localStorage.setItem("floracare_user_id", userId);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function scrollToBottom() {
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function bubble(who) {
  if (hero && who === "user") {
    hero.style.display = "none";
  }
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b);
  log.appendChild(m);
  scrollToBottom();
  return b;
}

function showTyping() {
  const m = el("div", "msg agent", null);
  m.id = "typing-agent";
  const b = el("div", "bubble");
  const ti = el("div", "typing-indicator");
  ti.appendChild(el("div", "typing-dot"));
  ti.appendChild(el("div", "typing-dot"));
  ti.appendChild(el("div", "typing-dot"));
  b.appendChild(ti);
  m.appendChild(b);
  log.appendChild(m);
  scrollToBottom();
  return m;
}

function hideTyping() {
  const ti = document.getElementById("typing-agent");
  if (ti) ti.remove();
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) {
    for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  }
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "";
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined");
      s.textContent = iconName(boundStr(props.name) || props.name);
      return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
    }
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) {
      const spec = comps[id];
      childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c));
    }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) {
    const node = buildNode(rid, comps, new Set());
    if (node) { container.appendChild(node); drew = true; }
  }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
    }
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts
    .filter(p => p && (p.kind === "text" || (!p.kind && p.text)))
    .map(p => p.text || "")
    .filter(t => {
      const s = t.trim();
      return !s.startsWith("{'name':") && !s.startsWith('{"name":') && !s.startsWith("{'response':") && !s.startsWith('{"response":');
    });
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const textNode = el("div", null, textStr);
    textNode.style.whiteSpace = "pre-wrap";
    b.appendChild(textNode);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  scrollToBottom();
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  
  showTyping();
  
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, user_id: userId })
    });
    
    hideTyping();
    const b = bubble("agent");

    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    hideTyping();
    const b = bubble("agent");
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
